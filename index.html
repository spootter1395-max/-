<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فاکتور فروش آذرخش</title>
  <style>
    body { font-family: 'Vazir', sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; }
    .dark-mode { background-color: #121212; color: #f1f1f1; }
    .container { max-width: 800px; margin: auto; padding: 20px; }
    input, button, select, textarea { font-family: inherit; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; background-color: #007bff; color: white; border: none; }
    button:hover { background-color: #0056b3; }
    .whatsapp-button { display: inline-block; padding: 10px 15px; background-color: #25D366; color: white; text-decoration: none; border-radius: 5px; }
    .print-button { margin-top: 10px; background-color: #28a745; }
    .invoice-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .invoice-table th, .invoice-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    .invoice-header { margin-bottom: 10px; }
    .invoice-signature { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🧾 فرم سفارش آذرخش</h2>

    <div>
      <label>نام مشتری:</label>
      <input type="text" id="customerName" />
      <label>شماره موبایل:</label>
      <input type="text" id="customerPhone" />
      <label>توضیحات:</label>
      <textarea id="customerNote"></textarea>
    </div>

    <hr />

    <div>
      <h3>🛒 انتخاب محصول</h3>
      <label>لیوانی ۳۵ مصرف میکس شهددار ماهشین:</label>
      <input type="number" id="cartonCount-3" placeholder="تعداد کارتن" />
      <button onclick="updatePrice(3, 870000, 900000)">محاسبه قیمت</button>
      <p id="priceLabel-3"></p>
      <p>قیمت کل: <span id="finalPrice-3">۰</span> تومان</p>
      <button onclick="addToCart(3, 'لیوانی ۳۵ شهددار ماهشین', 870000, 900000)">➕ افزودن به سبد</button>
    </div>

    <hr />

    <div id="cartItems"></div>
    <p id="cartTotal">💰 جمع کل: ۰ تومان</p>
    <button onclick="generateWhatsAppLink()">📤 ساخت فاکتور و ارسال واتساپ</button>
    <button onclick="toggleDarkMode()">🌙 حالت شب</button>
    <button onclick="playClickSound()">🔊 تست صدا</button>

    <div id="whatsappLink"></div>
    <div id="invoiceTable"></div>
  </div>

  <audio id="clickSound" src="click.mp3" preload="auto"></audio>
